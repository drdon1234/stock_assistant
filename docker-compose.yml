# InStock：数据库 + Web 服务 + 调度进程。配置见同目录 .env（由 .env.example 复制）
# 默认拉取 Docker Hub 镜像；从源码构建时先执行 docker build -t drdon1234/stock_assistant:latest .
name: instock

x-app: &app
  image: ${INSTOCK_IMAGE:-drdon1234/stock_assistant:latest}
  restart: unless-stopped
  environment:
    MYSQL_HOST: instock-db
    MYSQL_USER: root
    MYSQL_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
    INSTOCK_ADMIN_USER: ${INSTOCK_ADMIN_USER:-}
    INSTOCK_ADMIN_PASSWORD: ${INSTOCK_ADMIN_PASSWORD:-}
    INSTOCK_TRUST_PROXY: ${INSTOCK_TRUST_PROXY:-}
    INSTOCK_QUANT_START: ${INSTOCK_QUANT_START:-2005-01-01}
    INSTOCK_QUANT_WORKERS: ${INSTOCK_QUANT_WORKERS:-}
    TZ: Asia/Shanghai
  volumes:
    - ${INSTOCK_HOME:-./data}/app:/data
  depends_on:
    instock-db:
      condition: service_healthy

services:
  instock-db:
    image: mariadb:11
    container_name: instock-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - ${INSTOCK_HOME:-./data}/mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  instock-web:
    <<: *app
    container_name: instock-web
    command: ["python", "-m", "instock", "web"]
    ports:
      - "${INSTOCK_PORT:-9988}:9988"

  instock-worker:
    <<: *app
    container_name: instock-worker
    command: ["python", "-m", "instock", "worker"]

  # 聚宽策略回测运行器：执行网页提交的策略代码。隔离措施：无网络、无数据库凭证，只挂载回测数据目录，
  # 策略在降权为 nobody 的子进程中运行（看不到其他任务的代码、不能写文件），并限制内存与进程数
  instock-backtest:
    image: ${INSTOCK_IMAGE:-drdon1234/stock_assistant:latest}
    container_name: instock-backtest
    restart: unless-stopped
    command: ["python", "-m", "instock", "quant", "runner"]
    environment:
      INSTOCK_QUANT_SANDBOX: "1"
      TZ: Asia/Shanghai
    volumes:
      - ${INSTOCK_HOME:-./data}/app/quant:/data/quant
      - ${INSTOCK_HOME:-./data}/app/log:/data/log
    tmpfs:
      - /tmp
    network_mode: none
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, KILL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 4g
    pids_limit: 256
